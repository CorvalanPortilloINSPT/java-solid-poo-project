spring.application.name=frontend-fastfood

# Puerto del front (el backend usa el 8080)
server.port=8081

# Ubicación de las vistas JSP
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# URL base de la API del backend.
# Si el backend corre en otra PC, se cambia al ejecutar, sin recompilar:
#   java -jar frontend-fastfood-0.0.1-SNAPSHOT.war --backend.url=http://IP_DEL_BACKEND:8080
backend.url=http://localhost:8080